<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface-variant": "#c6c6cd",
                    "secondary": "#ddb7ff",
                    "surface-variant": "#2e3447",
                    "on-primary-fixed": "#001f25",
                    "secondary-fixed": "#f0dbff",
                    "primary-fixed": "#a2eeff",
                    "on-error-container": "#ffdad6",
                    "on-secondary-container": "#d6a9ff",
                    "surface-container-low": "#151b2d",
                    "surface-container-high": "#23293c",
                    "background": "#0c1324",
                    "on-primary-fixed-variant": "#004e5a",
                    "surface": "#0c1324",
                    "surface-bright": "#33394c",
                    "surface-container-highest": "#2e3447",
                    "on-tertiary-fixed-variant": "#41474e",
                    "outline": "#909097",
                    "on-tertiary-fixed": "#161c22",
                    "primary-fixed-dim": "#2fd9f4",
                    "tertiary-container": "#03070c",
                    "inverse-on-surface": "#2a3043",
                    "secondary-container": "#6f00be",
                    "outline-variant": "#46464c",
                    "on-primary-container": "#008496",
                    "on-tertiary-container": "#727980",
                    "on-secondary-fixed": "#2c0051",
                    "surface-container": "#191f31",
                    "inverse-primary": "#006877",
                    "on-secondary": "#490080",
                    "on-tertiary": "#2b3137",
                    "tertiary-fixed": "#dde3eb",
                    "on-background": "#dce1fb",
                    "on-surface": "#dce1fb",
                    "error": "#ffb4ab",
                    "on-error": "#690005",
                    "on-primary": "#00363e",
                    "surface-dim": "#0c1324",
                    "tertiary": "#c1c7cf",
                    "error-container": "#93000a",
                    "on-secondary-fixed-variant": "#6900b3",
                    "secondary-fixed-dim": "#ddb7ff",
                    "inverse-surface": "#dce1fb",
                    "primary": "#2fd9f4",
                    "primary-container": "#00080b",
                    "surface-tint": "#2fd9f4",
                    "surface-container-lowest": "#070d1f",
                    "tertiary-fixed-dim": "#c1c7cf"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Inter"],
                    "label": ["Space Grotesk"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-obsidian-gradient {
            background: radial-gradient(circle at center, #151b2d 0%, #0c1324 100%);
        }
        .text-glow-primary {
            text-shadow: 0 0 40px rgba(47, 217, 244, 0.3);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col selection:bg-primary/30">
<!-- TopAppBar -->
<header class="fixed top-0 w-full flex justify-between items-center px-8 py-6 w-full z-50 bg-transparent">
<div class="text-2xl font-bold tracking-widest text-slate-200 font-['Space_Grotesk'] tracking-tighter">
            CHRONOS
        </div>
<div class="flex gap-6 items-center">
<button class="text-slate-400 hover:text-cyan-300 transition-colors scale-95 active:duration-150">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
<button class="text-slate-400 hover:text-cyan-300 transition-colors scale-95 active:duration-150">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<!-- Main Content: Digital Clock Canvas -->
<main class="flex-grow flex flex-col items-center justify-center relative px-6 bg-obsidian-gradient">
<!-- Ambient Light Effect -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Date Display -->
<div class="mb-8 z-10">
<span class="font-headline text-slate-400 uppercase tracking-[0.3em] text-sm md:text-base font-medium">
                24 MAYIS 2024
            </span>
</div>
<!-- Digital Time Readout -->
<div class="relative z-10 flex flex-col items-center">
<h1 class="font-headline font-bold text-7xl md:text-[12rem] lg:text-[16rem] leading-none text-slate-200 tracking-tighter flex items-baseline gap-2 md:gap-4 select-none">
<span class="text-glow-primary">20</span>
<span class="text-primary/40 animate-pulse">:</span>
<span class="text-glow-primary">45</span>
<span class="text-primary text-4xl md:text-6xl lg:text-8xl ml-2 font-light opacity-80">32</span>
</h1>
<!-- Secondary Info / Timezone -->
<div class="mt-8 flex items-center gap-4 px-6 py-3 rounded-full bg-surface-container-low/40 backdrop-blur-md">
<span class="material-symbols-outlined text-primary text-sm" data-icon="public">public</span>
<span class="font-label text-on-surface-variant text-xs uppercase tracking-widest">İstanbul, TR (GMT+3)</span>
</div>
</div>
<!-- Weather/Metric Overlay (Bento Style Sub-info) -->
<div class="absolute bottom-40 grid grid-cols-2 md:grid-cols-3 gap-4 w-full max-w-2xl px-6">
<div class="bg-surface-container-low/20 backdrop-blur-sm p-4 rounded-2xl flex items-center justify-between group transition-all hover:bg-surface-container-high/40">
<div>
<p class="text-[10px] uppercase tracking-widest text-slate-500 font-label">Hava</p>
<p class="text-lg font-headline font-semibold text-slate-200">24°C</p>
</div>
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="partly_cloudy_day">partly_cloudy_day</span>
</div>
<div class="bg-surface-container-low/20 backdrop-blur-sm p-4 rounded-2xl flex items-center justify-between group transition-all hover:bg-surface-container-high/40">
<div>
<p class="text-[10px] uppercase tracking-widest text-slate-500 font-label">Alarm</p>
<p class="text-lg font-headline font-semibold text-slate-200">07:30</p>
</div>
<span class="material-symbols-outlined text-secondary group-hover:scale-110 transition-transform" data-icon="alarm">alarm</span>
</div>
<div class="hidden md:flex bg-surface-container-low/20 backdrop-blur-sm p-4 rounded-2xl items-center justify-between group transition-all hover:bg-surface-container-high/40">
<div>
<p class="text-[10px] uppercase tracking-widest text-slate-500 font-label">Pil</p>
<p class="text-lg font-headline font-semibold text-slate-200">88%</p>
</div>
<span class="material-symbols-outlined text-emerald-400 group-hover:scale-110 transition-transform" data-icon="battery_charging_80">battery_charging_80</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-8 left-0 right-0 z-50 flex justify-around items-center px-4 py-2">
<div class="bg-slate-900/40 backdrop-blur-xl shadow-[0_0_40px_rgba(47,217,244,0.06)] flex justify-around items-center w-[90%] max-w-md rounded-2xl p-2">
<!-- Dijital (Active) -->
<a class="flex flex-col items-center justify-center text-cyan-400 bg-slate-800/50 rounded-xl px-6 py-2 transition-all scale-98 active:duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="schedule" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-medium">Dijital</span>
</a>
<!-- Analog (Inactive) -->
<a class="flex flex-col items-center justify-center text-slate-500 px-6 py-2 hover:bg-slate-800/30 transition-all scale-98 active:duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="watch">watch</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-medium">Analog</span>
</a>
<!-- Ayarlar (Inactive) -->
<a class="flex flex-col items-center justify-center text-slate-500 px-6 py-2 hover:bg-slate-800/30 transition-all scale-98 active:duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-medium">Ayarlar</span>
</a>
</div>
</nav>
<!-- Background Decorative Element (Obsidian Monolith Vibe) -->
<div class="fixed top-0 right-0 h-screen w-1/3 bg-gradient-to-l from-primary/5 to-transparent pointer-events-none opacity-40"></div>
<div class="fixed bottom-0 left-0 h-1/2 w-1/2 bg-gradient-to-tr from-secondary/5 to-transparent pointer-events-none opacity-30"></div>
</body></html>
