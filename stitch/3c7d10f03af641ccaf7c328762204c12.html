<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface-variant": "#c6c6cd",
                    "secondary": "#ddb7ff",
                    "surface-variant": "#2e3447",
                    "on-primary-fixed": "#001f25",
                    "secondary-fixed": "#f0dbff",
                    "primary-fixed": "#a2eeff",
                    "on-error-container": "#ffdad6",
                    "on-secondary-container": "#d6a9ff",
                    "surface-container-low": "#151b2d",
                    "surface-container-high": "#23293c",
                    "background": "#0c1324",
                    "on-primary-fixed-variant": "#004e5a",
                    "surface": "#0c1324",
                    "surface-bright": "#33394c",
                    "surface-container-highest": "#2e3447",
                    "on-tertiary-fixed-variant": "#41474e",
                    "outline": "#909097",
                    "on-tertiary-fixed": "#161c22",
                    "primary-fixed-dim": "#2fd9f4",
                    "tertiary-container": "#03070c",
                    "inverse-on-surface": "#2a3043",
                    "secondary-container": "#6f00be",
                    "outline-variant": "#46464c",
                    "on-primary-container": "#008496",
                    "on-tertiary-container": "#727980",
                    "on-secondary-fixed": "#2c0051",
                    "surface-container": "#191f31",
                    "inverse-primary": "#006877",
                    "on-secondary": "#490080",
                    "on-tertiary": "#2b3137",
                    "tertiary-fixed": "#dde3eb",
                    "on-background": "#dce1fb",
                    "on-surface": "#dce1fb",
                    "error": "#ffb4ab",
                    "on-error": "#690005",
                    "on-primary": "#00363e",
                    "surface-dim": "#0c1324",
                    "tertiary": "#c1c7cf",
                    "error-container": "#93000a",
                    "on-secondary-fixed-variant": "#6900b3",
                    "secondary-fixed-dim": "#ddb7ff",
                    "inverse-surface": "#dce1fb",
                    "primary": "#2fd9f4",
                    "primary-container": "#00080b",
                    "surface-tint": "#2fd9f4",
                    "surface-container-lowest": "#070d1f",
                    "tertiary-fixed-dim": "#c1c7cf"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Inter"],
                    "label": ["Space Grotesk"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0c1324; /* slate-950 equivalent from config */
            color: #dce1fb; /* slate-200 / on-surface equivalent */
            font-family: 'Inter', sans-serif;
        }
        .clock-shadow {
            box-shadow: 0 0 60px rgba(47, 217, 244, 0.04);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full flex justify-between items-center px-8 py-6 w-full bg-transparent z-50">
<div class="text-2xl font-bold tracking-widest text-slate-200 font-['Space_Grotesk'] tracking-tighter">CHRONOS</div>
<div class="flex gap-6">
<button class="text-slate-400 hover:text-cyan-300 transition-colors scale-95 active:duration-150">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
<button class="text-slate-400 hover:text-cyan-300 transition-colors scale-95 active:duration-150">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-6 mb-24">
<!-- Analog Clock Container -->
<div class="relative w-80 h-80 md:w-96 md:h-96 flex items-center justify-center">
<!-- Subtle Glow Background -->
<div class="absolute inset-0 rounded-full bg-primary/5 blur-3xl opacity-50"></div>
<!-- Analog Clock SVG -->
<svg class="w-full h-full drop-shadow-2xl" viewbox="0 0 400 400">
<!-- Outer Ring -->
<circle class="opacity-30" cx="200" cy="200" fill="none" r="190" stroke="#23293c" stroke-width="1"></circle>
<!-- Hour Markers -->
<g class="opacity-40" stroke="#909097" stroke-linecap="round" stroke-width="2">
<line x1="200" x2="200" y1="20" y2="40"></line>
<line x1="200" x2="200" y1="360" y2="380"></line>
<line x1="20" x2="40" y1="200" y2="200"></line>
<line x1="360" x2="380" y1="200" y2="200"></line>
<!-- Sub-markers -->
<g class="opacity-20">
<line x1="290" x2="300" y1="44" y2="61"></line>
<line x1="356" x2="339" y1="110" y2="100"></line>
<line x1="356" x2="339" y1="290" y2="300"></line>
<line x1="290" x2="300" y1="356" y2="339"></line>
<line x1="110" x2="100" y1="356" y2="339"></line>
<line x1="44" x2="61" y1="290" y2="300"></line>
<line x1="44" x2="61" y1="110" y2="100"></line>
<line x1="110" x2="100" y1="44" y2="61"></line>
</g>
</g>
<!-- Hands -->
<!-- Hour Hand -->
<line stroke="#dce1fb" stroke-linecap="round" stroke-width="6" transform="rotate(105, 200, 200)" x1="200" x2="200" y1="200" y2="120"></line>
<!-- Minute Hand -->
<line stroke="#c6c6cd" stroke-linecap="round" stroke-width="4" transform="rotate(330, 200, 200)" x1="200" x2="200" y1="200" y2="70"></line>
<!-- Second Hand -->
<line stroke="#2fd9f4" stroke-linecap="round" stroke-width="2" transform="rotate(215, 200, 200)" x1="200" x2="200" y1="220" y2="50"></line>
<!-- Center Pivot -->
<circle cx="200" cy="200" fill="#2fd9f4" r="6"></circle>
<circle cx="200" cy="200" fill="#0c1324" r="2"></circle>
</svg>
</div>
<!-- Date Display -->
<div class="mt-12 text-center">
<h2 class="font-['Space_Grotesk'] text-4xl md:text-5xl font-light tracking-tight text-on-surface-variant">
                24 MAYIS 2024
            </h2>
<div class="mt-2 flex items-center justify-center gap-4">
<span class="text-xs font-['Space_Grotesk'] uppercase tracking-[0.3em] text-primary/60">İstanbul</span>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<span class="text-xs font-['Space_Grotesk'] uppercase tracking-[0.3em] text-primary/60">GMT +3</span>
</div>
</div>
<!-- Secondary Info Bento -->
<div class="mt-16 grid grid-cols-2 gap-4 w-full max-w-sm">
<div class="bg-surface-container-low p-5 rounded-2xl flex flex-col items-start gap-1">
<span class="text-[10px] uppercase tracking-widest text-slate-500 font-medium">Gün Doğumu</span>
<span class="font-['Space_Grotesk'] text-xl text-slate-200">05:38</span>
</div>
<div class="bg-surface-container-low p-5 rounded-2xl flex flex-col items-start gap-1">
<span class="text-[10px] uppercase tracking-widest text-slate-500 font-medium">Gün Batımı</span>
<span class="font-['Space_Grotesk'] text-xl text-slate-200">20:24</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-8 left-0 right-0 z-50 flex justify-around items-center px-4 py-2">
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md rounded-2xl bg-slate-900/40 backdrop-blur-xl shadow-[0_0_40px_rgba(47,217,244,0.06)] flex justify-around items-center py-2">
<!-- Inactive: Dijital -->
<a class="flex flex-col items-center justify-center text-slate-500 px-6 py-2 hover:bg-slate-800/30 transition-all scale-98 active:duration-200 group" href="#">
<span class="material-symbols-outlined mb-1 group-hover:text-slate-300" data-icon="schedule">schedule</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-medium">Dijital</span>
</a>
<!-- Active: Analog -->
<a class="flex flex-col items-center justify-center text-cyan-400 bg-slate-800/50 rounded-xl px-6 py-2 scale-98 active:duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="watch" style="font-variation-settings: 'FILL' 1;">watch</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-medium">Analog</span>
</a>
<!-- Inactive: Ayarlar -->
<a class="flex flex-col items-center justify-center text-slate-500 px-6 py-2 hover:bg-slate-800/30 transition-all scale-98 active:duration-200 group" href="#">
<span class="material-symbols-outlined mb-1 group-hover:text-slate-300" data-icon="settings">settings</span>
<span class="font-['Inter'] text-[10px] uppercase tracking-widest font-medium">Ayarlar</span>
</a>
</div>
</nav>
<!-- Floating Background Elements -->
<div class="fixed top-1/4 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="fixed bottom-1/4 -right-20 w-80 h-80 bg-secondary/5 rounded-full blur-[120px] pointer-events-none"></div>
</body></html>
